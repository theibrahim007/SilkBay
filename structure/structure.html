<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Layout</title>
    <!-- Link to your compiled CSS file -->
    <link rel="stylesheet" href="structure.scss">
</head>
<body>

    <div class="container">
        <header>&lt;header&gt;</header>
        <nav>&lt;nav&gt;</nav>

        <div class="content-wrapper">
            <aside>&lt;aside&gt;</aside>

            <main>
                <span class="main-label">&lt;main&gt;</span>
                
                <!-- Yellow Article Box -->
                <article>
                    <span class="label">&lt;article&gt;</span>
                    
                    <figure>&lt;figure&gt;</figure>
                    <p>&lt;p&gt;</p>
                    <summary>&lt;summary&gt;</summary>

                    <!-- Red Section Box inside Article (As per image) -->
                    <section>&lt;section&gt;</section>
                </article>
            </main>
        </div>
    </div>

</body>
</html>
